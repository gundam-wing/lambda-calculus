name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Checkout reads the repository. lean-action's default .lake cache uses
# the Actions cache service, which does not need extra GITHUB_TOKEN scopes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
